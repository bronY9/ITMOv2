name: Python lint and tests

on:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Ruff and repository tests
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "commit=${{ github.sha }}"
          echo "runner=GitHub Actions"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.10

      - name: Run lint and tests
        run: |
          set +e
          make check
          code=$?
          echo "check_exit_code=${code}"
          exit "${code}"
